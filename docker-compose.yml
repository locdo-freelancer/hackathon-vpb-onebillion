version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: onebillion-postgres
    restart: always
    environment:
      POSTGRES_USER: onebillion
      POSTGRES_PASSWORD: onebillion123
      POSTGRES_DB: one_billion
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - onebillion-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onebillion"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: onebillion-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@onebillion.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - onebillion-network

volumes:
  postgres_data:
    driver: local

networks:
  onebillion-network:
    driver: bridge
